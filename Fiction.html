<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiction Books - BookVerse</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f4f4f4;
        }

        header{
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1{
            font-size: 36px;
        }

        header button{
            background-color: #e68900;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }

        .books-section{
            padding: 50px;
        }

        .books-container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .book-card{
            background-color: white;
            width: 250px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
            text-align: center;
        }

        .book-card:hover{
            transform: translateY(-10px);
        }

        .book-card img{
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .book-card h3{
            margin-top: 15px;
            font-size: 22px;
            color: #222;
        }

        .book-card p{
            color: #666;
            margin: 10px 0;
        }

        .price{
            font-size: 20px;
            color: #e91e63;
            font-weight: bold;
        }

        .book-card button{
            margin: 15px 0 20px;
            padding: 10px 20px;
            border: none;
            background-color: #ff9800;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .book-card button:hover{
            background-color: #e68900;
        }

    </style>
</head>
<body>
    <header>
        <h1>Fiction Books</h1>
        <a href="index.html">
            <button>Back</button>
        </a>
    </header>
    <section class="books-section">
        <div class="books-container">
            <div class="book-card">
                <img src="images/the-alchemist.jpg" alt="The Alchemist">
                <h3>The Alchemist</h3>
                <p>By Paulo Coelho</p>
                <p class="price">&#8377 399</p>
                <button>Add To Cart</button>
            </div>
            <div class="book-card">
                <img src="images/harrypotter.jpg" alt="Harry Potter">
                <h3>Harry Potter</h3>
                <p>By J.K. Rowling</p>
                <p class="price">&#8377 699</p>
                <button>Add To Cart</button>
            </div>
            <div class="book-card">
                <img src="images/hobbit.jpg" alt="The Hobbit">
                <h3>The Hobbit</h3>
                <p>By J.R.R. Tolkien</p>
                <p class="price">&#8377 499</p>
                <button>Add To Cart</button>
            </div>
            <div class="book-card">
                <img src="images/gatsby.jpg" alt="The Great Gatsby">
                <h3>The Great Gatsby</h3>
                <p>By F. Scott Fitzgerald</p>
                <p class="price">&#8377 450</p>
                <button>Add To Cart</button>
            </div>
            <div class="book-card">
                <img src="images/shadow.jpg" alt="Shadow and Bone">
                <h3>Shadow and Bone</h3>
                <p>By Leigh Bardugo</p>
                <p class="price">&#8377 599</p>
                <button>Add To Cart</button>
            </div>
            <div class="book-card">
                <img src="images/dune.jpg" alt="Dune">
                <h3>Dune</h3>
                <p>By Frank Herbert</p>
                <p class="price">&#8377 799</p>
                <button>Add To Cart</button>
            </div>
        </div>
    </section>
</body>
</html>
