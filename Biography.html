<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biography Books - BookVerse</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f4f4f4;
        }

        header{
            background-color: #6a040f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1{
            font-size: 36px;
        }

        .books-section{
            padding: 50px;
        }

        .books-container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .book-card{
            background-color: white;
            width: 250px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
            text-align: center;
        }

        .book-card:hover{
            transform: translateY(-10px);
        }

        .book-card img{
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .book-card h3{
            margin-top: 15px;
            font-size: 22px;
            color: #222;
        }

        .book-card p{
            color: #666;
            margin: 10px 0;
        }

        .price{
            font-size: 20px;
            color: #6a040f;
            font-weight: bold;
        }

        .book-card button{
            margin: 15px 0 20px;
            padding: 10px 20px;
            border: none;
            background-color: #9d0208;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .book-card button:hover{
            background-color: #6a040f;
        }

    </style>
</head>

<body>

    <header>
        <h1>Biography Books</h1>
    </header>

    <section class="books-section">

        <div class="books-container">

            <div class="book-card">
                <img src="images/stevejobs.jpg" alt="Steve Jobs">
                <h3>Steve Jobs</h3>
                <p>By Walter Isaacson</p>
                <p class="price">&#8377 699</p>
                <button>Add To Cart</button>
            </div>

            <div class="book-card">
                <img src="images/wingsfire.jpg" alt="Wings of Fire">
                <h3>Wings of Fire</h3>
                <p>By A.P.J Abdul Kalam</p>
                <p class="price">&#8377 399</p>
                <button>Add To Cart</button>
            </div>

            <div class="book-card">
                <img src="images/becoming.jpg" alt="Becoming">
                <h3>Becoming</h3>
                <p>By Michelle Obama</p>
                <p class="price">&#8377 599</p>
                <button>Add To Cart</button>
            </div>

            <div class="book-card">
                <img src="images/elonmusk.jpg" alt="Elon Musk">
                <h3>Elon Musk</h3>
                <p>By Ashlee Vance</p>
                <p class="price">&#8377 799</p>
                <button>Add To Cart</button>
            </div>

        </div>

    </section>

</body>
</html>
