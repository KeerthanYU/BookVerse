<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Help Books - BookVerse</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f4f4f4;
        }

        header{
            background-color: #3a0ca3;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1{
            font-size: 36px;
        }

        header button{
            background-color: #e68900;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }

        .books-section{
            padding: 50px;
        }

        .books-container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .book-card{
            background-color: white;
            width: 250px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
            text-align: center;
        }

        .book-card:hover{
            transform: translateY(-10px);
        }

        .book-card img{
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .book-card h3{
            margin-top: 15px;
            font-size: 22px;
            color: #222;
        }

        .book-card p{
            color: #666;
            margin: 10px 0;
        }

        .price{
            font-size: 20px;
            color: #3a0ca3;
            font-weight: bold;
        }

        .book-card button{
            margin: 15px 0 20px;
            padding: 10px 20px;
            border: none;
            background-color: #7209b7;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .book-card button:hover{
            background-color: #560bad;
        }

    </style>
</head>
<body>
    <header>
        <h1>Self-Help Books</h1>
        <a href="index.html">
            <button>Back</button>
        </a>
    </header>
    <section class="books-section">
        <div class="books-container">
            <div class="book-card">
                <img src="images/atomic.jpg" alt="Atomic Habits">
                <h3>Atomic Habits</h3>
                <p>By James Clear</p>
                <p class="price">&#8377 599</p>
                <button onclick="alert('Atomic Habits has been Added to the cart')">Add To Cart</button>
            </div>
            <div class="book-card">
                <img src="images/deepwork.jpg" alt="Deep Work">
                <h3>Deep Work</h3>
                <p>By Cal Newport</p>
                <p class="price">&#8377 499</p>
                <button onclick="alert('Deep Work has been Added to the cart')">Add To Cart</button>
            </div>
            <div class="book-card">
                <img src="images/monk.jpg" alt="Think Like a Monk">
                <h3>Think Like a Monk</h3>
                <p>By Jay Shetty</p>
                <p class="price">&#8377 450</p>
                <button onclick="alert('think like a Monk has been Added to the cart')">Add To Cart</button>
            </div>
            <div class="book-card">
                <img src="images/cant.jpg" alt="Can't Hurt Me">
                <h3>Can't Hurt Me</h3>
                <p>By David Goggins</p>
                <p class="price">&#8377 699</p>
                <button onclick="alert('Cant hurt me has been Added to the cart')">Add To Cart</button>
            </div>
        </div>
    </section>
</body>
</html>
